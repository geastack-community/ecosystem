name: Build Native

on:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: ["@geastack-community/webview"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential cmake || \
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev build-essential cmake

      - name: Install Dependencies
        run: pnpm install

      - name: Build Native & TS
        run: pnpm --filter ${{ matrix.target }} build